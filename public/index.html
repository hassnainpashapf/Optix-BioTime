/* ================= premium design system ================= */
:root{--ink:#0e1126;--ink2:#171b36;--brand:#6a5cff;--brand-d:#5444f0;--brand-soft:#efedff;--bg:#f4f5fb;--card:#fff;--line:#e8eaf3;--mut:#7b8199;--text:#1c2038;--ok:#12a37f;--warn:#d97706;--bad:#e5484d;--link:#5444f0;--series-1:#6a5cff;--r:16px;--sh:0 1px 2px rgba(20,24,60,.04),0 8px 24px rgba(20,24,60,.05)}

/* ===== v3: calmer, lighter shell (light sidebar, breadcrumb bar, command palette, dark mode) ===== */
:root{--bg:#f6f7fb;--card:#fff;--surface2:#fafbff;--hover:#f2f3fa;--line:#e9ebf4;--stroke:#dfe2f0;--text:#171a30;--mut:#7a8099;--brand:#6a5cff;--brand-d:#5445f2;--brand-soft:#efedff;--r:16px;--sh:0 1px 2px rgba(23,26,48,.04),0 6px 20px rgba(23,26,48,.05);--sh2:0 12px 40px rgba(23,26,48,.16)}

html{-webkit-text-size-adjust:100%}body{font:14px/1.5 "Inter","SF Pro Text",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:8px;border:2px solid transparent;background-clip:padding-box}*::-webkit-scrollbar-track{background:transparent}
#app{flex-direction:row;height:100vh;background:var(--bg)}
#side{width:256px;height:100vh;flex:none;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);color:var(--text);padding:0;overflow:hidden}
#logo{width:auto;height:64px;flex:none;padding:0 18px;background:transparent;color:var(--text);justify-content:flex-start;gap:11px;font-size:17px;font-weight:800;letter-spacing:-.02em}
#logo span:after{color:var(--mut)}
#sidetools{position:relative;display:block;height:auto;padding:2px 14px 10px;background:transparent}
#sidetools svg{position:absolute;left:26px;top:13px;width:15px;height:15px;color:var(--mut);pointer-events:none}
#sidetools input{display:block;width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font-size:13px}
#menu{flex:1;overflow-y:auto;padding:2px 0 24px}
.mg>.mh{height:38px;margin:1px 10px;padding:0 12px;border-radius:10px;color:#4a516f;font-weight:600;font-size:13.5px;gap:12px}
.mg>.mh:hover{background:var(--hover);color:var(--text)}.mg.open>.mh{color:var(--text)}.mg>.mh svg{color:var(--mut);opacity:1}.mg.open>.mh svg{color:var(--brand-d)}.mh .car{border-top-color:var(--mut)}
.mg .mi{height:34px;margin:1px 10px 1px 22px;padding-left:24px;border-radius:9px;color:var(--mut);font-size:13px;font-weight:500;background:transparent}
.mg.open .mi:before{background:var(--line)}.mg .mi:hover{background:var(--hover);color:var(--text)}.mg .mi.on{background:var(--brand-soft);color:var(--brand-d);font-weight:700;box-shadow:none}
.mg .msub{color:var(--mut);opacity:.8}
#work{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#top{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);color:var(--text);position:relative;z-index:6}
@supports(background:color-mix(in srgb,red,blue)){#top{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px)}}
#burger{display:none;width:36px;height:36px;align-items:center;justify-content:center;padding:0;border-radius:10px;cursor:pointer;color:var(--mut)}
#crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);min-width:0;white-space:nowrap}#crumb a{color:var(--mut);cursor:pointer;text-decoration:none}#crumb a:hover{color:var(--text)}#crumb b{color:var(--text);font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis}#crumb i{font-style:normal;opacity:.45}
#cmdk{height:36px;min-width:240px;padding:0 8px 0 12px;display:flex;align-items:center;gap:8px;justify-content:flex-start;color:var(--mut);font-weight:500;background:var(--surface2);border:1px solid var(--line);box-shadow:none;border-radius:10px}

.bell{border-color:var(--card)}
#umenu{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);color:var(--text);top:46px}

#tabs .tab{height:30px;padding:0 8px 0 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mut);font-size:12.5px;font-weight:600;gap:6px;box-shadow:none}

main{flex:1;min-height:0;overflow:auto;padding:18px 28px 56px;background:transparent;border:0}
main.in>*{animation:fadeUp .3s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:24px;font-weight:750;letter-spacing:-.02em;color:var(--text);margin:2px 0 14px}h3{font-size:15.5px;font-weight:700;color:var(--text)}
.card,.panel,details.card,.gc,.dx-c,.dx-k,.fbar,.tree{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.dx-k:hover{box-shadow:var(--sh2)}
input,select,textarea{height:36px;border:1px solid var(--stroke);border-radius:10px;background:var(--card);color:var(--text);font-size:13.5px}textarea{height:auto}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
button{height:36px;padding:0 16px;border-radius:10px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 1px 2px color-mix(in srgb,var(--brand) 40%,transparent)}
button:hover{filter:brightness(1.06)}
button.g{background:var(--card);color:var(--text);border:1px solid var(--stroke);box-shadow:none}button.g:hover{background:var(--hover)}html[data-theme=dark] button.g{color:var(--text)}
button.d{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);box-shadow:none}button.d:hover{background:var(--bad);color:#fff}
button.sm{height:28px;padding:0 11px;font-size:12px}
.tag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.tag[class*=" t-"]:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.gc th{background:var(--surface2);color:var(--mut);font-size:11.5px;letter-spacing:.05em}.gc td{padding:12px 16px;font-size:13.5px;border-bottom-color:var(--line);color:var(--text)}.gc tbody tr:hover td{background:var(--hover)}.gc tbody tr:nth-child(even) td{background:transparent}.gc tbody tr:nth-child(even):hover td{background:var(--hover)}
.gtools{border-bottom-color:var(--line)}.gs input{background:var(--surface2)}
.gfoot{justify-content:flex-start;background:var(--surface2);border-top:1px solid var(--line);gap:14px;padding:10px 16px;font-size:12.5px}.gfoot .gcount{margin-right:auto}.gfoot .gcount b{color:var(--text)}.gfoot .gsize{display:flex;align-items:center;gap:8px}
.gfoot .rf{background:var(--card);border:1px solid var(--stroke);color:var(--mut)}.gfoot .pgn button{background:transparent;color:var(--mut);border:0}.gfoot .pgn button:hover{background:var(--hover);color:var(--text)}.gfoot .pgn button.cur{background:var(--brand);color:#fff}html[data-theme=dark] .gfoot .pgn button.cur{color:#0c0f1f}
.gfoot select{width:68px}
/* toasts */
#toasts{position:fixed;right:20px;bottom:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{display:flex;gap:10px;align-items:flex-start;max-width:380px;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:var(--sh2);font-size:13.5px;cursor:pointer;animation:toastIn .22s ease both}
.toast i{font-style:normal;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:800;color:#fff;margin-top:1px}.toast.ok i{background:var(--ok)}.toast.bad i{background:var(--bad)}.toast.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.toast.out{opacity:0;transform:translateY(6px);transition:.35s}@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
/* command palette */
#pal{position:fixed;inset:0;z-index:1500;background:rgba(10,12,28,.45);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}

.palin{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}.palin svg{width:18px;height:18px;color:var(--mut);flex:none}.palin input{flex:1;height:54px;border:0;box-shadow:none!important;background:transparent;font-size:16px;padding:0}.palin kbd{font-family:inherit;font-size:11px;font-weight:600;border:1px solid var(--stroke);border-radius:6px;padding:4px 6px;color:var(--mut)}
#pall{max-height:50vh;overflow:auto;padding:6px}.pali{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text)}.pali span{color:var(--mut);font-size:12.5px}.pali.on,.pali:hover{background:var(--brand-soft)}.pali.on b{color:var(--brand-d)}.pale{padding:22px;text-align:center;color:var(--mut)}

<script>
const $=s=>document.querySelector(s);let T=sessionStorage.t||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:body&&JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(r.status===401&&path!=='login'){logout();throw Error('Login required')}
  if(!r.ok)throw Error(j.error||r.statusText);return j}
function toggleLoginPassword(b){const p=$('#p'),show=p.type==='password';p.type=show?'text':'password';b.title=show?'Hide password':'Show password';b.setAttribute('aria-label',b.title)}
async function login(){const er=$('#le');if(!$('#lgagree').checked){er.textContent='Please accept the Privacy Policy and Data Processing Agreement.';er.style.display='block';return}try{er.style.display='none';const j=await api('login','POST',{username:$('#u').value,password:$('#p').value});T=j.token;sessionStorage.t=T;boot()}catch(e){er.textContent=e.message;er.style.display='block'}}
function logout(){T='';sessionStorage.removeItem('t');$('#app').classList.remove('on');$('#app').style.display='none';$('#login').style.display='flex'}
const today=()=>new Date().toLocaleDateString('en-CA'),mstart=()=>today().slice(0,8)+'01';
const hm=m=>m?`${Math.floor(m/60)}h ${m%60}m`:'-';const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const TB={};let tbn=0;
const tbl=(cols,rows,o={})=>{const id='tb'+(++tbn);const pf=window.PENDF;window.PENDF=null;TB[id]={cols,rows,q:'',sort:null,page:0,size:o.size||20,hide:new Set(),f:pf||{},ss:window.ZK_SORT&&window.ZK_SORT[cur]};try{if(o.hide&&!localStorage['tbp:'+cur])o.hide.forEach(i=>TB[id].hide.add(i))}catch{}try{const pr=JSON.parse(localStorage['tbp:'+cur]||'null');if(pr){if(pr.size)TB[id].size=pr.size;if(pr.hide)cols.forEach((c,i)=>{if(pr.hide.includes(c[0])&&c[0]&&!c[3])TB[id].hide.add(i)})}}catch{}
  const ti=(t,d,f)=>`<button class="zi tbi" title="${t}" onclick="${f}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg></button>`,
  icons=`<span class="tbicons">${ti('Reset sort and search','<path d="M4 20L15 9M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 11l.7 1.3L21 13l-1.3.7L19 15l-.7-1.3L17 13l1.3-.7z"/>',`tbReset('${id}')`)}${ti('Expand','<path d="M4 20l6-6M4 15v5h5M20 4l-6 6M20 9V4h-5"/>',`tbFull('${id}')`)}${ti('History','<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5M12 8v4l3 2"/>',`tbHist('${id}')`)}${ti('Columns','<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/>',`tbCols('${id}',event)`)}${ti('Export','<path d="M21 11l-7-7v4C8 8 4 12 3 19c2.5-3.5 6-5 11-5v4z"/>',`tbCsv('${id}')`)}${ti('Preferences','<path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"/>',`tbPrefs('${id}')`)}</span>`,
  tools=`<div class="gtools tbtop">${icons}</div>`+(rows.length>10?`<div class="gtools"><span class="gs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input placeholder="Search in this table" oninput="tbQ('${id}',this.value)"></span></div>`:'');
  return `<div class="gc" id="${id}">${tools}<div class="gb">${tbBody(id)}</div></div>`};
function tbBody(id){const t=TB[id];let r=t.rows;
  if(t.q){const q=t.q.toLowerCase();r=r.filter(x=>Object.values(x).some(v=>v!=null&&typeof v!=='object'&&String(v).toLowerCase().includes(q)))}
  for(const [ci,f] of Object.entries(t.f||{})){const c=t.cols[ci];r=r.filter(x=>{const v=tbText(c,x).toLowerCase(),q=f.v.toLowerCase();if(f.t==='range'){const d=v.slice(0,10);return d>=f.from&&d<=f.to}return f.t==='exact'?v===q:f.t==='start'?v.startsWith(q):v.includes(q)})}
  if(t.sort){const [k,dir]=t.sort;r=[...r].sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??''),undefined,{numeric:true}))*dir})}
  const n=r.length,pages=Math.max(1,Math.ceil(n/t.size));if(t.page>=pages)t.page=pages-1;const s=t.page*t.size,vis=r.slice(s,s+t.size);
  const nums=[];for(let i=0;i<pages;i++)if(i===0||i===pages-1||Math.abs(i-t.page)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…');
  const vc=t.cols.map((c,i)=>i).filter(i=>!t.hide.has(i)),head=vc.map(i=>{const c=t.cols[i];return `<th${c[1]&&(!t.ss||t.ss.includes(c[0]))?` class="so" onclick="tbSort('${id}',${i})"`:''}>${c[3]?`<input type="checkbox" class="zha" onclick="zall('${c[3]}',this.checked)">`:esc(c[0])}${t.sort&&t.sort[2]===i?`<span class="ar">${t.sort[1]>0?'▲':'▼'}</span>`:''}</th>`}).join('');
  const body=vis.map(r=>`<tr${r.id!=null?` data-rid="${r.id}"`:''}>${vc.map(i=>{const c=t.cols[i];return `<td>${c[2]?c[2](r):esc(r[c[1]])}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${vc.length||1}" class="empty"><div class="emp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h4"/></svg><b>${t.q||Object.keys(t.f||{}).length?'Nothing matches':'Nothing here yet'}</b><u class="none">None</u><span>${t.q?'Try a different word.':'Records will appear here as they are added.'}</span></div></td></tr>`;
  const from=n?s+1:0,to=Math.min(n,s+t.size);
  return `<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`+
   `<div class="gfoot"><span class="cls"><button class="rf" title="Refresh" onclick="go(cur)">&#8635;</button><select onchange="tbSize('${id}',+this.value)">${[10,20,50,80,100,200].map(z=>`<option${z===t.size?' selected':''}>${z}</option>`).join('')}</select></span><span class="gcount">${n?`Showing <b>${from}&ndash;${to}</b> of <b>${n}</b>`:'No records'}</span><span class="pgn"><button ${t.page?'':'disabled'} onclick="tbPage('${id}',${t.page-1})" title="Previous">&lsaquo;</button>${nums.map(i=>i==='…'?'<span class="mut">…</span>':`<button class="${i===t.page?'cur':''}" onclick="tbPage('${id}',${i})">${i+1}</button>`).join('')}<button ${t.page<pages-1?'':'disabled'} onclick="tbPage('${id}',${t.page+1})" title="Next">&rsaquo;</button></span>`+
   `<span class="cls">Total ${n} Records <input id="${id}_j" value="${t.page+1}" onkeydown="if(event.key==='Enter')tbPage('${id}',Math.max(0,Math.min(${pages-1},(+this.value||1)-1)))"> Page <button class="go" onclick="tbPage('${id}',Math.max(0,Math.min(${pages-1},(+document.getElementById('${id}_j').value||1)-1)))">Confirm</button></span><span class="gsize">Rows <select onchange="tbSize('${id}',+this.value)">${[10,20,50,80,100,200].map(z=>`<option${z===t.size?' selected':''}>${z}</option>`).join('')}</select><button class="rf" title="Refresh" onclick="go(cur)">&#8635;</button></span></div>`}

function tbReset(id){const t=TB[id];t.q='';t.sort=null;t.page=0;t.hide.clear();t.f={};fltBadge();const i=document.querySelector('#'+id+' .gs input');if(i)i.value='';tbDraw(id)}
function tbSize2(id,ev){ev.stopPropagation();document.querySelectorAll('.tbmenu').forEach(m=>m.remove());const m=document.createElement('div');m.className='tbmenu';m.innerHTML=[10,20,50,80,100,200].map(z=>`<a onclick="tbSize('${id}',${z});document.querySelector('.tbmenu').remove()">${z} rows per page</a>`).join('');const b=ev.currentTarget.getBoundingClientRect();m.style.top=b.bottom+4+'px';m.style.left=Math.max(8,b.right-170)+'px';document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',function f(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('click',f)}}),0)}
function tbFull(id){const el=document.getElementById(id);el&&el.classList.toggle('tbfull')}
function tbCols(id,ev){ev.stopPropagation();document.querySelectorAll('.tbmenu').forEach(m=>m.remove());const t=TB[id],m=document.createElement('div');m.className='tbmenu';
  m.innerHTML=t.cols.map((c,i)=>c[0]&&!c[3]?`<label><input type="checkbox" ${t.hide.has(i)?'':'checked'} onchange="tbHide('${id}',${i},this.checked)"> ${esc(c[0])}</label>`:'').join('');
  const b=ev.currentTarget.getBoundingClientRect();m.style.top=b.bottom+4+'px';m.style.left=Math.max(8,b.right-180)+'px';document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',function f(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('click',f)}}),0)}
function tbHide(id,i,on){const t=TB[id];on?t.hide.delete(i):t.hide.add(i);tbDraw(id)}
function tbCsv(id){const t=TB[id],cs=t.cols.map((c,i)=>i).filter(i=>!t.hide.has(i)&&t.cols[i][0]&&!t.cols[i][3]),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let r=t.rows;
  const txt=(c,x)=>{if(!c[1]&&c[2]){const d=document.createElement('div');d.innerHTML=c[2](x);return d.textContent.trim()}const v=x[c[1]];return typeof v==='object'?'':v};
  const out=[cs.map(i=>q(t.cols[i][0])).join(','),...r.map(x=>cs.map(i=>q(txt(t.cols[i],x))).join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv'}));a.download=(cur||'table').replace(/\W+/g,'_')+'.csv';a.click()}

// Filter dropdown (as in the reference app): one popover per column with Contain / Exact / Start with, plus Clean Filter and a count badge
const tbText=(c,x)=>{if(!c[1]&&c[2]){const d=document.createElement('div');d.innerHTML=c[2](x);return d.textContent.trim()}const v=x[c[1]];if(c[0]==='State'&&(v===true||v===false||v===1||v===0))return v?'Online':'Offline';return v==null||typeof v==='object'?'':String(v)};
const fltTable=()=>{const e=document.querySelector('#main .gc[id^=tb]');return e&&TB[e.id]?e.id:null};
function fltBadge(){const id=fltTable(),n=id?Object.keys(TB[id].f||{}).length:0,b=document.getElementById('fltbadge');if(b){b.textContent=n;b.style.display=n?'inline-block':'none'}}
function fltMenu(ev){ev.stopPropagation();document.querySelectorAll('.tbmenu').forEach(m=>m.remove());const id=fltTable(),btn=ev.currentTarget,m=document.createElement('div');m.className='tbmenu fltm';
  const hasForm=!!document.querySelector('#main .fbar');
  if(!id&&!hasForm){m.innerHTML='<span class="mut sm" style="padding:6px 12px">Nothing to filter on this page</span>'}
  else{const t=id&&TB[id];m.innerHTML=(hasForm?`<a onclick="document.querySelector('.tbmenu').remove();document.getElementById('main').classList.toggle('showflt')">Search form</a>`:'')+(t?`<a onclick="fltClean('${id}')">Clean Filter</a><hr style="margin:3px 0;border:0;border-top:1px solid #eee">`+t.cols.map((c,i)=>c[0]&&!c[3]?`<a class="fi" onclick="fltPop(event,'${id}',${i})">${esc(c[0])}${t.f[i]?' <b style="color:#4f8a1e">&bull;</b>':''}<i style="float:right;margin-left:14px">&#9656;</i></a>`:'').join(''):'')}
  const b=btn.getBoundingClientRect();m.style.top=b.bottom+2+'px';m.style.left=b.left+'px';m.style.maxHeight='70vh';m.style.overflow='auto';document.body.appendChild(m);
  setTimeout(()=>document.addEventListener('click',function f(e){if(!m.contains(e.target)&&!document.querySelector('.fltpop')?.contains(e.target)){m.remove();document.querySelector('.fltpop')?.remove();document.removeEventListener('click',f)}}),0)}
function fltPop(ev,id,i){ev.stopPropagation();document.querySelector('.fltpop')?.remove();const t=TB[id],c=t.cols[i],f=t.f[i]||{t:'contain',v:''},p=document.createElement('div');p.className='tbmenu fltpop';
  const vals=[...new Set(t.rows.map(x=>tbText(c,x)).filter(Boolean))],isDate=vals.length&&vals.every(v=>/^\d{4}-\d\d-\d\d/.test(v)),iso=d=>d.toISOString().slice(0,10),now=new Date(),day=n=>iso(new Date(now.getTime()+n*864e5));
  let body;
  if(isDate){const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));const pre=[['Today',day(0),day(0)],['Yesterday',day(-1),day(-1)],['Last 7 Days',day(-6),day(0)],['This Week',iso(mon),day(0)],['This Month',iso(new Date(now.getFullYear(),now.getMonth(),1)),day(0)],['This Year',now.getFullYear()+'-01-01',day(0)]];
    body=`<div style="max-height:200px;overflow:auto">${pre.map(x=>`<a style="display:block;padding:5px 2px;cursor:pointer" onclick="document.getElementById('flt_from').value='${x[1]}';document.getElementById('flt_to').value='${x[2]}';fltApply('${id}',${i})">${x[0]}</a>`).join('')}</div><div style="margin:6px 0 4px;color:#888">Date Range</div><input id="flt_from" class="zd" value="${f.from||''}" placeholder="YYYY-MM-DD" style="width:100%;margin-bottom:4px"><input id="flt_to" class="zd" value="${f.to||''}" placeholder="YYYY-MM-DD" style="width:100%;margin-bottom:8px">`}
  else if(vals.length&&vals.length<=6)body=`<a style="display:block;padding:5px 2px;cursor:pointer" onclick="fltApply('${id}',${i},true)">All</a>${vals.map(v=>`<a style="display:block;padding:5px 2px;cursor:pointer${f.v===v?';color:#4f8a1e;font-weight:600':''}" onclick="document.getElementById('flt_v').value=this.dataset.v;document.getElementById('flt_t').value='exact';fltApply('${id}',${i})" data-v="${esc(v)}">${esc(v)}</a>`).join('')}<input id="flt_v" type="hidden"><input id="flt_t" type="hidden" value="exact">`;
  else body=`<select id="flt_t" style="width:100%;margin-bottom:6px"><option value="contain" ${f.t==='contain'?'selected':''}>Contain</option><option value="exact" ${f.t==='exact'?'selected':''}>Exact</option><option value="start" ${f.t==='start'?'selected':''}>Start with</option></select><input id="flt_v" value="${esc(f.v||'')}" placeholder="Search ${esc(c[0])}" style="width:100%;margin-bottom:8px" onkeydown="if(event.key==='Enter')fltApply('${id}',${i})">`;
  p.innerHTML=`<div style="padding:8px 10px;min-width:240px"><b style="display:block;margin-bottom:6px">${esc(c[0])}</b>${body}${vals.length&&!isDate&&vals.length<=6?'':`<button class="zb" style="height:28px;padding:0 16px;background:#7ac143;color:#fff" onclick="fltApply('${id}',${i})">Search</button> <button class="zb" style="height:28px;padding:0 14px" onclick="fltApply('${id}',${i},true)">Clear</button>`}</div>`;
  const b=ev.currentTarget.getBoundingClientRect();p.style.top=b.top+'px';p.style.left=b.right+4+'px';document.body.appendChild(p);document.getElementById('flt_v')?.focus()}
function fltApply(id,i,clear){const t=TB[id];if(clear)delete t.f[i];else if(document.getElementById('flt_from')){const fr=document.getElementById('flt_from').value.trim(),to=document.getElementById('flt_to').value.trim()||fr;if(fr)t.f[i]={t:'range',from:fr,to,v:fr};else delete t.f[i]}else{const v=document.getElementById('flt_v').value.trim();if(v)t.f[i]={t:document.getElementById('flt_t').value,v};else delete t.f[i]}t.page=0;tbDraw(id);fltBadge();document.querySelector('.fltpop')?.remove();document.querySelector('.tbmenu')?.remove()}
function fltClean(id){TB[id].f={};TB[id].page=0;tbDraw(id);fltBadge();document.querySelector('.tbmenu')?.remove()}

// History (recent changes made on this page, from the audit log) and Preferences (rows per page and columns, kept for this page)
async function tbHist(id){const kw=(ZK.t(cur)||cur).split(' ')[0];let rows=[];try{rows=await api('audit')}catch(e){return alert(e.message)}
  const draw=q=>{const r=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase())).slice(0,60);document.getElementById('th_b').innerHTML=r.length?`<table style="width:100%"><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${r.map(x=>`<tr><td style="white-space:nowrap">${esc(x.ts||'')}</td><td>${esc(x.user||'')}</td><td>${esc(x.method||'')}</td><td>${esc(x.summary||x.path||'')}</td></tr>`).join('')}</table>`:'<p class="mut" style="text-align:center;padding:16px">None</p>'};
  orgModal('History',`<div style="margin-bottom:8px"><input id="th_q" value="${esc(kw)}" placeholder="Filter" style="width:220px;height:28px" oninput="window.tbHistDraw(this.value)"></div><div id="th_b" style="max-height:380px;overflow:auto"></div>`,"document.getElementById('dvm').remove()",'Close');window.tbHistDraw=draw;draw(kw)}
function tbPrefs(id){const t=TB[id];let pr={};try{pr=JSON.parse(localStorage['tbp:'+cur]||'{}')}catch{}
  orgModal('Preferences',`<div class="grid"><label>Rows per page<select id="tp_s">${[10,20,50,80,100,200].map(z=>`<option ${z===t.size?'selected':''}>${z}</option>`).join('')}</select></label></div><div style="margin-top:10px"><b>Columns shown</b>${t.cols.map((c,i)=>c[0]&&!c[3]?`<label style="display:flex;flex-direction:row;align-items:center;gap:8px;margin:5px 0;font-weight:400"><input type="checkbox" class="tp_c" data-i="${i}" ${t.hide.has(i)?'':'checked'} style="width:16px;height:16px"> ${esc(c[0])}</label>`:'').join('')}</div><p class="mut sm">Saved on this computer for this page.</p>`,`tbPrefsSave('${id}')`,'Save');

  return `<div class="grid">${x.id?'':I('code','ID (blank = automatic)','')}${I('name','Full name',x.name)}${S('department_id','Department',L.d,x.department_id)}${S('branch_id','Branch',L.b,x.branch_id)}${S('designation_id','Designation',L.ds,x.designation_id)}${S('group_id','Group',L.g,x.group_id)}${S('shift_id','Shift',L.sh,x.shift_id)}${S('leave_policy_id','Leave policy',L.lp||[],x.leave_policy_id)}${S('ot_policy_id','Overtime policy',L.op||[],x.ot_policy_id)}${S('manager_id','Reports to (manager)',(L.mg||[]).filter(m=>m.id!==x.id),x.manager_id)}${S('rotation_id','Shift rotation',L.ro||[],x.rotation_id)}${I('rotation_anchor','Rotation day 1',x.rotation_anchor,'date')}
  ${I('salary','Monthly salary',x.salary||0,'number','min="0"')}${I('join_date','Join date (days before are not counted absent)',x.join_date,'date')}${I('email','Email',x.email,'email')}${I('phone','Phone',x.phone)}${I('card_no','Access card number',x.card_no)}
  <label>Gender<select id="f_gender"><option value="">-</option>${['male','female','other'].map(v=>`<option ${x.gender===v?'selected':''}>${v}</option>`).join('')}</select></label>${I('dob','Date of birth',x.dob,'date')}${I('address','Address',x.address)}${I('emergency_contact','Emergency contact',x.emergency_contact)}${(window.ME&&(window.ME.role==='admin'||window.ME.perms.payroll==='edit'))?`${I('cnic','CNIC',x.cnic)}${I('eobi_no','EOBI number',x.eobi_no)}${I('bank_name','Bank',x.bank_name)}${I('bank_account','Bank account / IBAN',x.bank_account)}${I('bank_title','Account title',x.bank_title)}`:''}
  ${(L.cf||[]).map(c=>c.type==='select'?`<label>${esc(c.label)}<select id="c_${c.id}"><option value="">-</option>${String(c.options||'').split(',').map(v=>v.trim()).filter(Boolean).map(v=>`<option ${cfv[c.id]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`:`<label>${esc(c.label)}<input id="c_${c.id}" type="${c.type==='number'?'number':c.type==='date'?'date':'text'}" value="${esc(cfv[c.id])}"></label>`).join('')}</div>`}
function readEmpForm(cf){const b={};for(const k of ['code','name','department_id','branch_id','designation_id','group_id','shift_id','leave_policy_id','ot_policy_id','manager_id','rotation_id','rotation_anchor','card_no','salary','join_date','email','phone','gender','dob','address','emergency_contact','cnic','eobi_no','bank_name','bank_account','bank_title']){const el=document.getElementById('f_'+k);if(el)b[k]=el.value===''?null:el.value}
  if(b.salary!==undefined&&b.salary!==null)b.salary=+b.salary;if(b.code===null)delete b.code;
  b.custom={};for(const c of cf||[]){const el=document.getElementById('c_'+c.id);if(el)b.custom[c.id]=el.value}return b}

// ---- charts: one hue, thin bars, rounded data end, quiet grid; every mark has a tooltip and the numbers are also available as a table
function vbars(data){if(!data.length)return '<p class="mut">No data in this range.</p>';const W=Math.max(420,data.length*30),H=170,L=30,B=24,T=8,max=Math.max(1,...data.map(d=>d.value)),step=(W-L-6)/data.length,bw=Math.min(18,step*.62),y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,.5,1].map(t=>Math.round(max*t));const every=Math.ceil(data.length/14);
  return `<div class="wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,420)}px" role="img" aria-label="Bar chart">`+
   ticks.map(t=>`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end" font-size="10" fill="var(--mut)">${t}</text>`).join('')+
   data.map((d,i)=>{const x=L+i*step+(step-bw)/2,h=Math.max(0,H-B-y(d.value)),r=Math.min(4,bw/2,h);return `<g data-tip="${esc(d.tip||d.label+': '+d.value)}"><rect x="${L+i*step}" y="${T}" width="${step}" height="${H-T-B}" fill="transparent"/>${h?`<path d="M${x} ${H-B}V${y(d.value)+r}Q${x} ${y(d.value)} ${x+r} ${y(d.value)}H${x+bw-r}Q${x+bw} ${y(d.value)} ${x+bw} ${y(d.value)+r}V${H-B}Z" fill="var(--series-1)"/>`:''}${i%every===0?`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(d.label)}</text>`:''}</g>`}).join('')+`</svg></div>`}
const bic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.Doc}</svg>`;
const addD=(s,n)=>{const x=new Date(s+'T00:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};
function stackBars(daily){
  if(!daily.length)return '<p class="mut">No data in this range.</p>';
  const W=620,H=250,L=34,B=28,T=10,seg=[['present','Present','#12a37f'],['late','Late','#f5a524'],['absent','Absent','#f0506e'],['leave','Leave','#8b7bff']];
  const tot=d=>seg.reduce((s,k)=>s+d[k[0]],0),max=Math.max(1,...daily.map(tot)),step=(W-L-6)/daily.length,bw=Math.min(40,step*.6),y=v=>T+(H-T-B)*(1-v/max),every=Math.ceil(daily.length/12);
  const ticks=[...new Set([0,.25,.5,.75,1].map(t=>Math.round(max*t)))];

function code39(t){const P={0:'nnnwwnwnn',1:'wnnwnnnnw',2:'nnwwnnnnw',3:'wnwwnnnnn',4:'nnnwwnnnw',5:'wnnwwnnnn',6:'nnwwwnnnn',7:'nnnwnnwnw',8:'wnnwnnwnn',9:'nnwwnnwnn',A:'wnnnnwnnw',B:'nnwnnwnnw',C:'wnwnnwnnn',D:'nnnnwwnnw',E:'wnnnwwnnn',F:'nnwnwwnnn',G:'nnnnnwwnw',H:'wnnnnwwnn',I:'nnwnnwwnn',J:'nnnnwwwnn',K:'wnnnnnnww',L:'nnwnnnnww',M:'wnwnnnnwn',N:'nnnnwnnww',O:'wnnnwnnwn',P:'nnwnwnnwn',Q:'nnnnnnwww',R:'wnnnnnwwn',S:'nnwnnnwwn',T:'nnnnwnwwn',U:'wwnnnnnnw',V:'nwwnnnnnw',W:'wwwnnnnnn',X:'nwnnwnnnw',Y:'wwnnwnnnn',Z:'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'};
  const s='*'+String(t).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'-')+'*';let x=0,r='';for(const ch of s){let bar=true;for(const w of P[ch]){const wd=w==='w'?3:1;if(bar)r+=`<rect x="${x}" y="0" width="${wd}" height="50"/>`;x+=wd;bar=!bar}x+=1}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x} 50" width="${x*1.6}" height="64" fill="#000">${r}</svg>`}

async function go(p,opt){ // refresh in place when p is already showing; otherwise open (or switch to) its workspace tab
  if(!(p in pages))return;
  if(!TABS.includes(p))TABS.push(p);
  if(p==='Dashboard')window.MOD=null;else if(!opt?.keepMod){const m=moduleOf(p);if(m&&m!==window.MOD){window.MOD=m;window.curItem=null}}
  drawFrame(p);await render(p)}

function sideSearch(){const i=document.getElementById('msearch'),t=document.getElementById('sidetools');t.classList.toggle('open');if(t.classList.contains('open'))i.focus();else{i.value='';menuSearch()}}
function sideFold(){window.GOPEN=window.GOPEN||{};const mod=window.MOD;if(!mod)return;MODULES[mod].forEach((g,gi)=>{window.GOPEN[mod+'|'+gi]=false});drawFrame(cur)}
function togGrp(k,on){window.GOPEN=window.GOPEN||{};window.GOPEN[k]=!!on;drawFrame(cur)}
function drawFrame(p){const me=window.ME;if(!me)return;const app=$('#app'),mod=window.MOD&&visMods().includes(window.MOD)?window.MOD:null;
  app.classList.remove('nosidebar');
  app.classList.toggle('home',!mod);
  $('#mods').innerHTML=visMods().map(m=>`<li class="${m===mod?'on':''}" onclick="openMod('${m}')">${m}</li>`).join('');
  $('#crumb').innerHTML=mod?`<a onclick="openMod('${mod}')">${esc(mod)}</a><i>/</i><b>${esc(window.curItem||(window.ZK?ZK.t(p):p))}</b>`:`<b>${p==='Dashboard'?'Home':esc(p)}</b>`;
  window.OPEN=window.OPEN||{};
  const q=($('#msearch').value||'').toLowerCase(),B=window.BADGE||{};
  const item=(m,gi,y,groups)=>{const on=m===mod&&itemPage(y.it)===p&&(y.it[0]===window.curItem||!window.curItem||!y.it[2]),n=B[itemPage(y.it)],col=MODCOL[m]||['#eceaff','#5445f2'];
    return `<div class="mi2 ${on?'on':''}" title="${esc(y.it[0])}" onclick="openItem('${m}',${gi},${y.ii})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IIC[y.it[0]]||ICONS[groups[gi][1]]||ICONS.Doc}</svg><span>${esc(y.it[0])}</span>${n?`<em class="bd">${n}</em>`:''}</div>`};
  const block=(m)=>{const groups=visGroups(m),col=MODCOL[m]||['#eceaff','#5445f2'];
    const sec=groups.map((g,gi)=>({g,gi,items:g[2].map((it,ii)=>({it,ii})).filter(x=>!q||x.it[0].toLowerCase().includes(q)||m.toLowerCase().includes(q))})).filter(x=>x.items.length);if(!sec.length)return '';
    return `<div class="ms${mod&&!q?' solo':''}" style="--c:${col[1]}"><div class="msl"><i></i><span>${esc(m)}</span></div>`+sec.map(x=>{const k=m+'|'+x.gi,has=x.items.some(y=>m===mod&&itemPage(y.it)===p),op=q?true:(window.GOPEN&&k in window.GOPEN?window.GOPEN[k]:(has||groups.length===1));
      return `<div class="mss${groups.length>1?'':' single'}${op?' open':''}" onclick="togGrp('${k}',${op?0:1})"><svg class="gi" viewBox="0 0 24 24" fill="currentColor">${GI[x.g[0]]||''}</svg>${esc(x.g[0])}</div><div class="mgi${op?'':' shut'}">`+x.items.map(y=>item(m,x.gi,y,groups)).join('')+'</div>'}).join('')+'</div>'};
  const home=`<div class="mi2 ${p==='Dashboard'?'on':''}" title="Dashboard" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IIC.Dashboard}</svg><span>Dashboard</span></div>`;
  $('#menu').innerHTML=home+(mod||q?(q?visMods():[mod]):visMods()).map(block).join('');
  $('#tabs').innerHTML=TABS.map(t=>`<div class="tab ${t===p?'on':''}" onclick="window.empId=null;go('${t}')">${esc(tabName(t))}${t==='Dashboard'?'':`<span class="x" onclick="closeTab('${t}',event)">&times;</span>`}</div>`).join('')}
function menuSearch(){drawFrame(cur)}
async function accountAction(action){$('#umenu').classList.remove('show');
  if(action==='logout'){logout();return}
  if(action==='theme'){toggleTheme();return}
  if(action==='api'){go('Integrations');return}
  if(action==='account'||action==='password'){window.stab='Access';window.curItem='Account & roles';await go('Settings');if(action==='password')document.getElementById('np')?.focus();return}
  if(action==='language'){alert('English is the current interface language.');return}
  if(action==='about'){try{const v=await api('system/update');alert(`ZKT Attendance Server ${v.current||''}`)}catch(e){alert(e.message)}}
}
async function boot(){$('#login').style.display='none';window.scrollTo(0,0);$('#app').classList.add('on');$('#app').style.display='flex';
  let me;try{me=await api('me')}catch{return}window.ME=me;window.TABS=['Dashboard'];window.MOD=null;window.curItem=null;window.OPEN={};
  $('#uav').innerHTML='<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#f0f1f2"/><path d="M8 36c1-7 6-9 12-9s11 2 12 9" fill="#999"/><path d="M13 13c0-5 3-8 7-8s7 3 7 8v7c-1 5-4 8-7 8s-6-3-7-8z" fill="#999"/></svg>';$('#suav').textContent=(me.user||'A')[0].toUpperCase();$('#sun').textContent=me.user;$('#sur').textContent=me.role==='admin'?'Administrator':me.role.charAt(0).toUpperCase()+me.role.slice(1);
  const canEdit=me.role==='admin'||Object.values(me.perms).some(v=>v==='edit'||String(v).startsWith('view+')),note=[];if(!canEdit)note.push('Read-only');if(me.scoped)note.push('Part of the company');
  const acctIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7z"/></svg>',infoIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><rect x="11" y="10" width="2" height="7" fill="#fff"/><circle cx="12" cy="7" r="1" fill="#fff"/></svg>',editIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h14v3H6v12h13v-9h3v10H3zM12 16l2-5 7-7 3 3-7 7z"/></svg>';
  const row=(label,icon,action,enabled=true)=>`<div class="acctrow" role="menuitem" ${enabled?`onclick="event.stopPropagation();accountAction('${action}')"`:'aria-disabled="true" title="Not available in ZKT yet"'}>${icon}<span>${esc(label)}</span></div>`;
  $('#umenu').setAttribute('role','menu');$('#umenu').innerHTML=row(me.user,acctIcon,'account')+row('About',infoIcon,'about')+row('API',infoIcon,'api')+row('Help',infoIcon,'help',false)+'<div class="acctsep"></div>'+row('Controller',editIcon,'controller',false)+row('Language',infoIcon,'language')+'<div class="acctsep"></div>'+row('Password Question',editIcon,'questions',false)+row('Password',editIcon,'password')+'<div class="acctsep"></div>'+row('Theme',infoIcon,'theme')+row('Logout',infoIcon,'logout');
  document.addEventListener('click',()=>$('#umenu').classList.remove('show'));
  cur='Dashboard';drawFrame('Dashboard');render('Dashboard');refreshBell();clearInterval(window.bellT);window.bellT=setInterval(refreshBell,60000)}
$('#p').addEventListener('keydown',e=>e.key==='Enter'&&login());
if(T)api('dashboard').then(()=>true,()=>false).then(ok=>ok?boot():($('#login').style.display='flex'));else $('#login').style.display='flex';
