async function alertPref(kind,on){try{await api('alerts/prefs','PUT',{kind,enabled:on})}catch(e){alert(e.message);go('alerts')}}
async function alertOpts(){try{await api('alerts/options','PUT',{watch_mode:$('#wm').value});go('alerts')}catch(e){alert(e.message)}}
async function alertWatch(){try{await api('alerts/watch','POST',{employee_id:+$('#ww').value});go('alerts')}catch(e){alert(e.message)}}
async function alertUnwatch(id){try{await api('alerts/watch/'+id,'DELETE');go('alerts')}catch(e){alert(e.message)}}
async function alertQuiet(clear){try{await api('alerts/options','PUT',{quiet_start:clear?null:$('#qs').value||null,quiet_end:clear?null:$('#qe').value||null});flash(clear?'Quiet hours cleared':'Saved','ok');if(clear)go('alerts')}catch(e){flash(e.message,'bad')}}

async function mobPair(){try{const [c,si]=await Promise.all([api('mobile/pair-code','POST'),api('mobile/server-info')]);const u=`${location.origin}/m`;alert(`On the phone open the Attendance Alerts app (or ${u}) and type this code:\n\n${c.code.slice(0,4)} ${c.code.slice(4)}\n\nIt works once and expires in 10 minutes.`);go('alerts')}catch(e){alert(e.message)}}
async function mobRemove(id){if(!confirm('Disconnect this phone?'))return;try{await api('mobile/devices/'+id,'DELETE');go('alerts')}catch(e){alert(e.message)}}

const applyLeave=()=>act(()=>api('leaves','POST',{type:$('#lt').value,from_date:$('#lf').value,to_date:$('#lto').value,half:$('#lh').checked,note:$('#ln').value}),'Leave request sent');

const sendAtt=()=>{const od=$('#ak').value==='on_duty';act(()=>api('attendance/requests','POST',{date:$('#ad').value,kind:$('#ak').value,time:od?null:$('#atime').value,status_text:od?$('#astat').value:null,reason:$('#ar').value}),'Request sent')};
const cancelAtt=id=>act(()=>api(`attendance/requests/${id}/cancel`,'POST',{}));
const sendShift=()=>{const sw=$('#sk').value==='swap';act(()=>api('shifts/requests','POST',{kind:$('#sk').value,shift_id:sw?null:+$('#ss').value,other_employee_id:sw?+$('#sother').value:null,from_date:$('#sf').value,to_date:$('#st').value,reason:$('#sr').value}),'Request sent','flash2')};

async function rsvp(id,v){try{await api(`meetings/${id}/rsvp`,'POST',{rsvp:v});go('meetings')}catch(e){alert(e.message)}}
async function teamAct(kind,id,action){let note='';if(action==='reject'){note=prompt('Reason for rejecting (optional):');if(note===null)return}try{await api(`team/${kind}/${id}/${action}`,'POST',{note});ME.pending_team=Math.max(0,(ME.pending_team||1)-1);go('team')}catch(e){flash(e.message,'bad')}}
function getPosition(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(Error('This browser cannot share a location.'));navigator.geolocation.getCurrentPosition(ok,e=>no(Error(e.code===1?'Location access is blocked. Allow location for this site in your browser settings, then try again.':e.code===3?'Could not get your location in time. Step outside or try again.':'Could not get your location.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
function deviceId(){try{let d=localStorage.did;if(!d){d=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.did=d}return d}catch{return''}}
async function punch(){if(busy)return;busy=true;const b=$('#pb');b.disabled=true;const label=b.textContent;flash('Getting your location...','warn');
  try{let pos={};{try{const p=await getPosition();pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}}catch(e){if(ME.gps_policy>0)throw e}}
    flash('Recording your punch...','warn');const r=await api('punch','POST',{...pos,device_id:deviceId()});
    flash(`${r.kind==='in'?'Checked in':'Checked out'} at ${r.time}${r.site?' · '+r.site:''}${r.distance_m!==null&&r.distance_m!==undefined?' ('+r.distance_m+' m away)':''}${r.flagged?'. HR will review this punch: '+r.note:''}`,r.flagged?'warn':'ok');
    busy=false;ME=await api('me');drawNav();setTimeout(()=>go('home'),2500)}
  catch(e){busy=false;b.disabled=false;b.textContent=label;flash(e.message,'bad')}}
async function pendingTeam(){try{if(ME.is_manager){const p=await api('team/pending');ME.pending_team=p.leaves.length+p.attendance.length+p.shifts.length+p.overtime.length;drawNav()}}catch{}}
$('#lp').addEventListener('keydown',e=>e.key==='Enter'&&doLogin());
if(T)start().then(pendingTeam);else $('#login').hidden=false;
setInterval(()=>{if(T&&ME&&!busy)api('me').then(m=>{ME.unread=m.unread;drawNav()}).catch(()=>{})},60000);
</script></body></html>
