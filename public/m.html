<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Optix alerts</title><meta name="theme-color" content="#6a5cff"><link rel="manifest" href="/m.webmanifest"><link rel="icon" href="/portal-icon.svg">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c2038;--mut:#7b8199;--line:#e8eaf3;--brand:#6a5cff;--brand-soft:#efedff;--ok:#12a37f;--warn:#d98a06;--bad:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0e1126;--card:#171b36;--ink:#e8ebfa;--mut:#9aa1c4;--line:#262b4d;--brand:#8c80ff;--brand-soft:#242a55}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:6px 0 2px}h2{font-size:16px;margin:18px 0 6px}.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
button,input,select{font:inherit;color:var(--ink)}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:6px 0}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:600}button.g{background:var(--brand-soft);color:var(--brand)}button.d{background:#fde8e8;color:var(--bad)}
.code{font-size:30px;letter-spacing:.3em;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav a{flex:1;text-align:center;padding:8px;font-size:13px;color:var(--mut);font-weight:600}nav a.on{color:var(--brand)}
.it{display:flex;gap:12px;align-items:flex-start}.dot{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}.it.silent .dot{background:var(--line)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand);letter-spacing:.02em}.chip.late{background:#fff1d6;color:var(--warn)}.chip.punch{background:#dff7ee;color:var(--ok)}.chip.bad{background:#fde8e8;color:var(--bad)}
.sw{position:relative;display:inline-block;width:48px;height:28px;flex:none}.sw input{opacity:0;position:absolute;width:0;height:0}.sw i{position:absolute;inset:0;background:var(--line);border-radius:28px;transition:.15s}.sw i:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--brand)}.sw input:checked+i:before{transform:translateX(20px)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.live.off{background:var(--bad)}.err{color:var(--bad)}
</style></head><body>
<main id="app"></main><nav id="nav" hidden><a id="n1" onclick="show('feed')">Alerts</a><a id="n2" onclick="show('settings')">Settings</a></nav>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK='',ME=null,view='feed',ITEMS=[],LATEST=0,LISTEN=false,ONLINE=true;try{TOK=localStorage.m_tok||''}catch{}
async function api(p,m='GET',b){const r=await fetch('/api/m/'+p,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json().catch(()=>({}));
  if(r.status===401&&TOK&&p!=='pair'){unpair(false);throw Error(j.error||'Not paired')}if(!r.ok)throw Error(j.error||r.statusText);return j}
const bridge=()=>window.Android&&window.Android.saveSession;
function saveTok(t){TOK=t;try{localStorage.m_tok=t}catch{}if(bridge())window.Android.saveSession(location.origin,t)}
function unpair(call=true){if(call&&TOK)api('logout','POST').catch(()=>{});TOK='';ME=null;ITEMS=[];LISTEN=false;try{localStorage.removeItem('m_tok')}catch{}if(window.Android&&window.Android.clearSession)window.Android.clearSession();draw()}
const ago=s=>{const d=(Date.now()-Date.parse(String(s).replace(' ','T')))/1000;return d<60?'just now':d<3600?Math.floor(d/60)+' min ago':d<86400?Math.floor(d/3600)+' h ago':String(s).slice(0,10)};
async function pair(){const e=$('#perr');e.textContent='';try{const j=await api('pair','POST',{code:$('#pc').value,device_name:navigator.userAgent.includes('Android')?'Android phone':(navigator.platform||'Phone')});saveTok(j.token);await start()}catch(x){e.textContent=x.message}}
async function start(){try{ME=await api('me')}catch{return draw()}LATEST=ME.latest;const f=await api('feed?limit=40');ITEMS=f.items;LATEST=Math.max(LATEST,f.latest||0);draw();listen()}
async function listen(){if(LISTEN||!TOK)return;LISTEN=true;while(LISTEN&&TOK){try{const r=await api(`feed?since=${LATEST}&wait=20`);ONLINE=true;if(r.items.length){LATEST=r.latest;ITEMS=[...r.items,...ITEMS].slice(0,100);for(const it of r.items.slice(0,3))localNote(it);if(view==='feed')drawFeed()}setLive()}catch(e){if(!TOK)break;ONLINE=false;setLive();await new Promise(r=>setTimeout(r,5000))}}LISTEN=false}
function setLive(){const l=$('#live');if(l){l.className='live'+(ONLINE?'':' off');l.nextSibling.textContent=ONLINE?'Listening':'Reconnecting...'}}
function localNote(it){if(window.Android||it.silent||!('Notification'in window)||Notification.permission!=='granted')return;try{new Notification(it.title,{body:it.body||'',icon:'/portal-icon.svg'})}catch{}}
function show(v){view=v;draw()}
function draw(){const a=$('#app');$('#nav').hidden=!TOK;if(!TOK){return a.innerHTML=`<h1>Attendance alerts</h1><p class="mut">Get your attendance alerts on this phone.</p><div class="card"><b>Connect this phone</b><ol class="sm mut" style="padding-left:18px"><li>On the computer open <b>System &rarr; My alerts &rarr; Connect a phone</b>.</li><li>Employees: open the employee portal &rarr; <b>More &rarr; Alert settings &rarr; Connect a phone</b>.</li><li>Type the 8-digit code here (it works once, for 10 minutes).</li></ol><p id="apk" class="sm" hidden>Want alerts while the phone is locked? <a href="/downloads/attendance-alerts.apk"><b>Install the Android app</b></a> (you may need to allow installs from this source).</p><input id="pc" class="code" inputmode="numeric" maxlength="8" placeholder="00000000" onkeydown="if(event.key==='Enter')pair()"><button style="width:100%" onclick="pair()">Connect</button><p id="perr" class="err"></p></div>`}
  $('#n1').className=view==='feed'?'on':'';$('#n2').className=view==='settings'?'on':'';view==='feed'?drawFeed():drawSettings()}
function drawFeed(){const a=$('#app');a.innerHTML=`<div class="row"><h1>Alerts</h1><span class="sm mut"><span id="live" class="live"></span><span>Listening</span></span></div><p class="mut sm">${esc(ME?.name||'')}${ME?.kind==='staff'?' (staff)':''}</p>`+
  (ITEMS.length?ITEMS.map(i=>`<div class="card it ${i.silent?'silent':''}"><div class="dot"></div><div style="min-width:0"><span class="chip ${i.kind==='late'?'late':i.kind==='punch'||i.kind==='my_punch'?'punch':/device|temp/.test(i.kind)?'bad':''}">${esc(i.label)}</span> <span class="sm mut">${ago(i.created)}${i.silent?' · quiet hours':''}</span><div><b>${esc(i.title)}</b></div>${i.body?`<div class="sm mut">${esc(i.body)}</div>`:''}</div></div>`).join(''):'<div class="card mut">No alerts yet. They appear here as they happen.</div>')}
async function drawSettings(){const a=$('#app');a.innerHTML='<p class="mut">Loading...</p>';try{const [s,team]=await Promise.all([api('alerts'),api('team')]),groups=[...new Set(s.prefs.map(p=>p.group))],canWatch=true;
  a.innerHTML=`<h1>Settings</h1><p class="mut sm">Switch alerts on or off for yourself.</p>`+groups.map(g=>`<div class="card"><b>${esc(g)}</b>${s.prefs.filter(p=>p.group===g).map(p=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line);margin-top:8px"><div><b style="font-size:15px">${esc(p.label)}</b><div class="sm mut">${esc(p.desc)}</div></div><label class="sw"><input type="checkbox" ${p.enabled?'checked':''} onchange="pref('${p.kind}',this.checked)"><i></i></label></div>`).join('')}</div>`).join('')+
  `<div class="card"><b>Quiet hours</b><div class="sm mut">Alerts still arrive, without a sound.</div><div class="row"><div style="flex:1"><label class="sm mut">From</label><input id="qs" type="time" value="${esc(s.options.quiet_start||'')}"></div><div style="flex:1"><label class="sm mut">To</label><input id="qe" type="time" value="${esc(s.options.quiet_end||'')}"></div></div><button class="g" onclick="quiet()">Save</button> <button class="g" onclick="quiet(true)">Clear</button></div>`+
  (team.length?`<div class="card"><b>Follow arrivals</b><div class="sm mut">For "Arrivals and departures" and "Late arrivals".</div><select id="wm" onchange="opts()"><option value="all" ${s.options.watch_mode==='all'?'selected':''}>Everyone I can see</option><option value="watch" ${s.options.watch_mode==='watch'?'selected':''}>Only my watch list</option></select><div class="row"><select id="ww">${team.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button onclick="watch()">Add</button></div><div>${s.watch.map(w=>`<span class="chip" style="margin:2px">${esc(w.name)} <a onclick="unwatch(${w.id})">&times;</a></span>`).join('')||'<span class="sm mut">Nobody on the list.</span>'}</div></div>`:'')+
  `<button class="g" style="width:100%;margin:6px 0" onclick="test()">Send me a test alert</button>${'Notification'in window&&!window.Android&&Notification.permission==='default'?`<button class="g" style="width:100%;margin:6px 0" onclick="Notification.requestPermission().then(()=>show('settings'))">Allow notifications in this browser</button>`:''}${window.Android&&window.Android.changeServer?`<button class="g" style="width:100%;margin:6px 0" onclick="Android.changeServer()">Change server address</button>`:''}<button class="d" style="width:100%;margin:6px 0" onclick="if(confirm('Disconnect this phone? You will stop getting alerts here.'))unpair()">Disconnect this phone</button><p class="sm mut">This page only alerts while it is open. For alerts when the phone is locked, use the Android app.</p>`}catch(e){a.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
async function pref(k,on){try{await api('alerts/prefs','PUT',{kind:k,enabled:on})}catch(e){alert(e.message);drawSettings()}}
async function quiet(c){try{await api('alerts/options','PUT',{quiet_start:c?null:$('#qs').value||null,quiet_end:c?null:$('#qe').value||null});if(c)drawSettings();else alert('Saved')}catch(e){alert(e.message)}}
async function opts(){try{await api('alerts/options','PUT',{watch_mode:$('#wm').value});drawSettings()}catch(e){alert(e.message)}}
async function watch(){try{await api('alerts/watch','POST',{employee_id:+$('#ww').value});drawSettings()}catch(e){alert(e.message)}}
async function unwatch(id){try{await api('alerts/watch/'+id,'DELETE');drawSettings()}catch(e){alert(e.message)}}
async function test(){try{await api('alerts/test','POST');alert('Sent: it should arrive in a moment.')}catch(e){alert(e.message)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOK&&!LISTEN)listen()});
fetch('/downloads/attendance-alerts.apk',{method:'HEAD'}).then(r=>{const e=document.getElementById('apk');if(r.ok&&e&&!window.Android)e.hidden=false}).catch(()=>{});
if(TOK){if(bridge())window.Android.saveSession(location.origin,TOK);start()}else draw();
</script></body></html>
